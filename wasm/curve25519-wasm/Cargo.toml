[package]
name = "curve25519-node-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WASM primitives for curve25519-node modern API"
repository = "https://github.com/unknownncat/curve25519-node"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
x25519-dalek = { version = "2", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
