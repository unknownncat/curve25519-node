[package]
name = "curve25519-node-axlsign"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "axlsign-compatible primitives for curve25519-node via wasm-bindgen"
repository = "https://github.com/unknownncat/curve25519-node"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
sha2 = "0.10"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
